name: Serpiente de contribuciones

on:
  schedule:
    - cron: "0 0 * * *"   # se actualiza sola cada día
  workflow_dispatch:       # botón para lanzarla a mano
  push:
    branches: [main]       # y cada vez que subes algo

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generar la serpiente
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/serpiente.svg?palette=github-dark&color_snake=#ff5fa2&color_dots=#161b22,#3d1a6e,#7a1e6e,#c2185b,#ff8fd0

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
